let audioCtx=null;function sfx(type='click'){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const presets={click:[520,.045,'square',.025],pickup:[880,.08,'sine',.045],open:[250,.11,'triangle',.035],close:[190,.08,'triangle',.03],coin:[1050,.09,'sine',.04],talk:[390,.07,'triangle',.03],error:[120,.12,'sawtooth',.035],shot:[85,.075,'sawtooth',.06],reload:[300,.12,'square',.03],door:[145,.16,'triangle',.045]};const a=presets[type]||presets.click;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=a[2];o.frequency.setValueAtTime(a[0],now);if(type==='pickup'||type==='coin')o.frequency.exponentialRampToValueAtTime(a[0]*1.35,now+a[1]);g.gain.setValueAtTime(a[3],now);g.gain.exponentialRampToValueAtTime(.001,now+a[1]);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+a[1]+.01)}catch(e){}}

function hitWall(x,y,r){for(const w of G.obs){if(G.inHouse&&w===G.currentHouse)continue;const cx=Math.max(w.x,Math.min(x,w.x+w.w)),cy=Math.max(w.y,Math.min(y,w.y+w.h));if((x-cx)**2+(y-cy)**2<r*r)return w}return null}
function houseWallBlocked(x,y,r){
  if(!G.inHouse||!G.currentHouse)return false;const h=G.currentHouse;
  // Interior walls are solid. The only opening is the doorway in the middle of the south wall.
  const doorX=h.x+h.w/2,door=Math.abs(x-doorX)<24;
  if(x<h.x+r||x>h.x+h.w-r||y<h.y+r)return true;
  if(y>h.y+h.h-r-2&&!door)return true;
  // Keep the player inside the doorway threshold until they press INTERACT to leave.
  return false;
}
function doorPass(x,y,r,wall){return !!(!G.inHouse&&wall&&(wall.t==='house'||wall.t==='shop')&&Math.abs(x-(wall.x+wall.w/2))<Math.min(25,wall.w*.18)&&y>wall.y+wall.h-r-8&&y<wall.y+wall.h+30)}
function move(o,dx,dy,r){const ox=o.x,oy=o.y;const nx=o.x+dx;const wx=hitWall(nx,o.y,r);if(nx>r&&nx<MW-r&&!houseWallBlocked(nx,o.y,r)&&(!wx||doorPass(nx,o.y,r,wx)))o.x=nx;const ny=o.y+dy;const wy=hitWall(o.x,ny,r);if(ny>r&&ny<MH-r&&!houseWallBlocked(o.x,ny,r)&&(!wy||doorPass(o.x,ny,r,wy)))o.y=ny;return Math.hypot(o.x-ox,o.y-oy)}
function los(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y);for(let t=0;t<d;t+=14){const x=a.x+(b.x-a.x)*t/d,y=a.y+(b.y-a.y)*t/d;for(const w of G.obs)if(w.see!==false&&x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)return false}return true}
function free(m,far){for(let i=0;i<80;i++){const x=R(80,MW-80),y=R(80,MH-80);if(!hitWall(x,y,m)&&Math.hypot(x-G.p.x,y-G.p.y)>far&&Math.hypot(x-G.ex.x,y-G.ex.y)>200)return{x,y}}return{x:MW/2,y:MH/2}}
function lootFree(gap=145,far=170){for(let i=0;i<220;i++){const p=free(14,far);let ok=true;for(const q of [...(G.crates||[]),...(G.floorItems||[])])if(Math.hypot(q.x-p.x,q.y-p.y)<gap){ok=false;break}if(ok)return p}return free(14,far)}
function rectFree(x,y,w,h,m,road){
  for(const o of G.obs)if(x<o.x+o.w+m&&x+w+m>o.x&&y<o.y+o.h+m&&y+h+m>o.y)return false;
  if(!road)for(const r of G.roads)if(x<r.x+r.w+20&&x+w>r.x-20&&y<r.y+r.h+20&&y+h>r.y-20)return false;
  const nz=(px,py)=>x<px+250&&x+w>px-250&&y<py+250&&y+h>py-250;
  if(nz(G.p.x,G.p.y)||nz(G.ex.x,G.ex.y))return false;
  return x>40&&y>40&&x+w<MW-40&&y+h<MH-40}
function rollItem(){const r=Math.random();if(r<.08)return{n:'Аптечка',k:'med',v:30};if(r<.15)return{n:'Консервы',k:'food',v:45};if(r<.21)return{n:'Бутылка воды',k:'water',v:25};if(r<.235)return{n:'Пистолет',k:'pistol',v:90,weapon:'pistol'};if(r<.25)return{n:'Пистолет-пулемёт',k:'smg',v:150,weapon:'smg'};const weights=[1,1,0.35,0.8,0.6,0.55,1,0.8,1];let total=weights.reduce((a,b)=>a+b,0),v=Math.random()*total,idx=0;for(;idx<weights.length-1;idx++){v-=weights[idx];if(v<=0)break}const t=ITEMS[idx];return{n:t.n,k:t.k,v:Math.round(R(t.v[0],t.v[1]))}}

function genMap(){

  // Главные улицы проходят через населённый район, а не появляются в случайном месте.
  const roadX=Math.round(MW*(.46+R(-.035,.035))), roadY=Math.round(MH*(.51+R(-.035,.035)));
  g.roads=[{x:roadX-58,y:0,w:116,h:MH,v:1},{x:0,y:roadY-58,w:MW,h:116}];

  const tp=(n,mk,road)=>{let c=0,tr=0;while(c<n&&tr<1800){tr++;const o=mk();const isBuilding=['house','shop','kiosk'].includes(o.t);const gap=isBuilding?105:(o.t==='cont'?32:24);if(rectFree(o.x,o.y,o.w,o.h,Math.max(o.m||34,gap),road)){g.obs.push(o);c++}}};

  tp(4,()=>{const w=R(130,170),h=R(90,110);return{t:'shop',x:rx(w),y:ry(h),w,h,H:46,col:['#d8c26a','#7fb0a5','#c98a7a'][Math.floor(R(0,3))],aw:['#c0392b','#2e86c1','#27ae60'][Math.floor(R(0,3))],nm:['МАГАЗИН','АПТЕКА','БАР'][Math.floor(R(0,3))],m:70}});
  tp(5,()=>{const w=56,h=46;return{t:'kiosk',x:rx(w),y:ry(h),w,h,H:38,col:['#d94f4f','#4f8ad9','#e0b43c'][Math.floor(R(0,3))]}});
  tp(5,()=>{const a=Math.random()<.5,w=a?92:36,h=a?36:92;return{t:'cont',x:rx(w),y:ry(h),w,h,H:34,col:rc()}});
  tp(8,()=>{const a=Math.random()<.5,w=a?72:34,h=a?34:72;return{t:'car',x:rx(w),y:ry(h),w,h,H:24,col:['#8a4b2a','#5d6f7a','#6e7a3f','#9a9a8a'][Math.floor(R(0,4))],m:24}},true);
  tp(6,()=>{const x=rx(18),y=ry(18);return{t:'barrel',x,y,w:16,h:16,H:22,col:['#b03a2e','#2e7d4f','#2c5d8f'][Math.floor(R(0,3))],see:false,m:12}});
  tp(7,()=>{const a=Math.random()<.5,w=a?R(100,180):6,h=a?6:R(100,180);return{t:'fence',x:rx(w),y:ry(h),w,h,H:18,see:false,m:16}});
  g.ruinC=[];
  for(let i=0,c=0;i<400&&c<5;i++){

    r.crates.push({x,y,it:rollItem(),open:0,done:false,kind:pick(['tool','medbag','bag','cabinet','metal'])})}
  // Loose scavenging items are visible in the world, not hidden behind generic boxes.

  for(const h of r.obs.filter(o=>o.t==='house'||o.t==='shop')){h.searched=false;h.roomLoot=[];const n=1+Math.floor(R(0,3));for(let j=0;j<n;j++){h.roomLoot.push({x:h.x+R(20,h.w-20),y:h.y+R(18,h.h-18),it:rollItem(),done:false,kind:pick(['cloth','metal','bag','medbag','food'])})}}
  for(let i=0;i<16;i++){const f=free(24,480),t=pick(TYPES);
    r.en.push({...t,r:12*t.s,id:i+2,x:f.x,y:f.y,hx:f.x,hy:f.y,mhp:t.hp,ang:R(0,6.28),cd:R(0,1),st:'patrol',lt:0,lx:0,ly:0,wp:null,wait:R(0,2),rt:0,fl:0,hurt:0,flip:1,mv:0,ph:0,side:1,aim:0,ex:0})}
  const n=r.wx.k==='rain'?130:r.wx.k==='dust'?90:0;
  for(let i=0;i<n;i++)r.rp.push(r.wx.k==='rain'?{x:R(0,W),y:R(0,H),vx:-120,vy:R(600,800)}:{x:R(0,W),y:R(0,H),vx:R(600,950),vy:R(60,140)});
  r.cam.x=(r.p.x-r.p.y)*C-W/2;r.cam.y=(r.p.x+r.p.y)*C*.5-H*.5;
  return r}

function raccoon(c){
  c.clearRect(0,0,96,96);c.lineJoin='round';c.lineWidth=3;c.strokeStyle=INK;
  const E=(x,y,rx,ry,f)=>{c.fillStyle=f;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();c.stroke()};
  for(const sx of[-1,1]){E(48+sx*29,24,10,12,'#7d8590');E(48+sx*29,26,5,7,'#e8a0a8')}
  E(48,58,34,30,'#929ba5');E(48,68,19,15,'#e7e7df');
  c.fillStyle='#2c2f36';for(const sx of[-1,1]){c.beginPath();c.ellipse(48+sx*16,50,10,7,sx*-.2,0,7);c.fill()}
  for(const sx of[-1,1]){c.fillStyle='#fff';c.beginPath();c.arc(48+sx*16,50,3.8,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(48+sx*15.5,50.5,1.7,0,7);c.fill()}
  c.fillStyle='#2c2f36';c.beginPath();c.moveTo(48,34);c.lineTo(43,45);c.lineTo(53,45);c.closePath();c.fill();
  E(48,63,5,4,'#111');
  c.lineWidth=2;c.beginPath();c.moveTo(40,68);c.quadraticCurveTo(48,72,56,68);c.stroke();
  c.lineWidth=1.5;c.beginPath();for(const sx of[-1,1]){c.moveTo(48+sx*14,66);c.lineTo(48+sx*34,62);c.moveTo(48+sx*14,69);c.lineTo(48+sx*34,71)}c.stroke();
  c.lineWidth=2.5;c.fillStyle='#39362f';c.beginPath();c.arc(48,36,22,Math.PI,2*Math.PI);c.closePath();c.fill();c.stroke();
  c.beginPath();c.ellipse(62,37,18,3.5,0,0,7);c.fill();c.stroke();
}

function drawTrader(c,id){
  // Animal traders in the same gritty, hand-painted survival-game style.
  c.clearRect(0,0,120,120);c.save();c.lineJoin='round';c.lineCap='round';
  const med=id==='npc-med',gun=id==='npc-gun',armor=!med&&!gun;
  const bg=c.createLinearGradient(0,0,120,120);bg.addColorStop(0,med?'#53664e':gun?'#69513b':'#4f5b61');bg.addColorStop(.55,'#2c261d');bg.addColorStop(1,'#100e0b');c.fillStyle=bg;c.fillRect(0,0,120,120);
  // softly lit background rivets and workshop silhouettes
  c.globalAlpha=.22;c.fillStyle='#c8b17b';for(let i=0;i<6;i++){c.beginPath();c.arc(12+i*19,14+(i%2)*7,1.5,0,Math.PI*2);c.fill()}c.globalAlpha=1;
  c.fillStyle='#171612';c.beginPath();c.moveTo(5,120);c.quadraticCurveTo(10,86,34,80);c.lineTo(85,80);c.quadraticCurveTo(112,88,116,120);c.fill();
  // shoulders and profession-specific tactical clothing
  c.fillStyle=med?'#697b5a':gun?'#69523b':'#647078';c.beginPath();c.moveTo(21,120);c.lineTo(29,91);c.quadraticCurveTo(40,78,60,79);c.quadraticCurveTo(82,78,92,92);c.lineTo(101,120);c.closePath();c.fill();
  c.strokeStyle='#a38a54';c.lineWidth=2;c.beginPath();c.moveTo(39,88);c.lineTo(43,120);c.moveTo(80,88);c.lineTo(76,120);c.stroke();
  if(med){c.fillStyle='#d7d3bd';c.fillRect(47,91,27,22);c.fillStyle='#9e3d32';c.fillRect(57,94,7,16);c.fillRect(52,99,17,6);}
  if(gun){c.fillStyle='#252722';c.fillRect(16,91,37,7);c.fillRect(42,96,7,14);c.strokeStyle='#b7a17b';c.strokeRect(16,91,37,7);}
  if(armor){c.fillStyle='#3b4548';c.beginPath();c.moveTo(38,86);c.lineTo(82,86);c.lineTo(88,116);c.lineTo(33,116);c.closePath();c.fill();c.strokeStyle='#c7a24a';c.strokeRect(39,89,42,24);for(let x=45;x<=75;x+=10){c.fillStyle='#87918d';c.fillRect(x,94,5,5)}}
  // ears: hedgehog rounded ears, fox/wolf pointed ears, boar ears
  if(med){
    c.fillStyle='#827d68';c.strokeStyle='#171713';c.lineWidth=3;
    for(const x of [36,84]){c.beginPath();c.ellipse(x,38,10,12,x===36?-.3:.3,0,Math.PI*2);c.fill();c.stroke();c.fillStyle='#bd8e83';c.beginPath();c.ellipse(x,39,4,6,0,0,Math.PI*2);c.fill();c.fillStyle='#827d68';}
  }else if(gun){
    c.fillStyle='#b86f42';c.strokeStyle='#211811';c.lineWidth=3;
    c.beginPath();c.moveTo(34,38);c.lineTo(25,8);c.quadraticCurveTo(42,15,47,31);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(73,31);c.quadraticCurveTo(82,15,96,8);c.lineTo(87,39);c.closePath();c.fill();c.stroke();
    c.fillStyle='#e4b28c';c.beginPath();c.moveTo(33,24);c.lineTo(38,31);c.lineTo(31,30);c.closePath();c.fill();c.beginPath();c.moveTo(88,24);c.lineTo(82,31);c.lineTo(90,30);c.closePath();c.fill();
  }else{
    c.fillStyle='#707b80';c.strokeStyle='#1c2021';c.lineWidth=3;
    c.beginPath();c.moveTo(34,42);c.lineTo(26,16);c.quadraticCurveTo(44,21,48,34);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(73,34);c.quadraticCurveTo(79,21,96,16);c.lineTo(86,44);c.closePath();c.fill();c.stroke();
  }
  // head silhouette with gentle gradients
  const fur=c.createLinearGradient(34,28,83,83);fur.addColorStop(0,med?'#aaa48c':gun?'#d28a55':'#939b9d');fur.addColorStop(1,med?'#625f50':gun?'#7e472e':'#4c555a');c.fillStyle=fur;c.strokeStyle='#181714';c.lineWidth=3;
  c.beginPath();if(med){c.ellipse(60,53,30,31,0,0,Math.PI*2)}else if(gun){c.moveTo(34,39);c.quadraticCurveTo(42,27,60,29);c.quadraticCurveTo(81,28,88,43);c.lineTo(84,66);c.quadraticCurveTo(79,84,60,87);c.quadraticCurveTo(39,82,34,62);c.closePath()}else{c.moveTo(32,42);c.quadraticCurveTo(42,28,60,30);c.quadraticCurveTo(80,28,89,43);c.lineTo(82,68);c.quadraticCurveTo(73,82,60,84);c.quadraticCurveTo(42,80,36,66);c.closePath()}c.fill();c.stroke();
  // face mask / muzzle
  if(med){
    // hedgehog quills as rounded strokes behind forehead
    c.strokeStyle='#4c4b3f';c.lineWidth=4;for(let i=0;i<9;i++){const x=34+i*6.5;c.beginPath();c.moveTo(x,39);c.lineTo(x-3+(i%2)*5,25-(i%3)*3);c.stroke()}
    c.fillStyle='#d2cbb6';c.beginPath();c.ellipse(60,63,19,14,0,0,Math.PI*2);c.fill();c.strokeStyle='#635d4c';c.lineWidth=2;c.stroke();
    c.fillStyle='#332b24';c.beginPath();c.ellipse(60,61,4,3,0,0,Math.PI*2);c.fill();
  }else if(gun){
    c.fillStyle='#f0c69b';c.beginPath();c.ellipse(60,64,20,15,0,0,Math.PI*2);c.fill();c.strokeStyle='#593622';c.lineWidth=2;c.stroke();
    c.fillStyle='#34221a';c.beginPath();c.moveTo(56,61);c.lineTo(64,61);c.lineTo(60,67);c.closePath();c.fill();
  }else{
    c.fillStyle='#b7b8b2';c.beginPath();c.ellipse(60,65,21,15,0,0,Math.PI*2);c.fill();c.strokeStyle='#434a4d';c.lineWidth=2;c.stroke();
    c.fillStyle='#292a29';c.beginPath();c.ellipse(60,61,6,4,0,0,Math.PI*2);c.fill();
    c.strokeStyle='#3c4244';c.lineWidth=2;c.beginPath();c.moveTo(48,71);c.quadraticCurveTo(60,77,72,71);c.stroke();
  }
  // eyes, brow, scars and cheek markings
  for(const x of [48,72]){c.fillStyle='#e8dfca';c.beginPath();c.ellipse(x,49,5.2,4.2,0,0,Math.PI*2);c.fill();c.fillStyle='#26221c';c.beginPath();c.arc(x+.4,49.2,1.9,0,Math.PI*2);c.fill();}
  c.strokeStyle='#382c20';c.lineWidth=2;c.beginPath();c.moveTo(42,43);c.lineTo(53,42);c.moveTo(67,42);c.lineTo(78,43);c.stroke();
  if(armor){c.strokeStyle='#a68d58';c.lineWidth=1.5;c.beginPath();c.moveTo(42,75);c.lineTo(49,77);c.moveTo(78,75);c.lineTo(71,77);c.stroke();}
  // worn metal frame and bottom title strip
  c.fillStyle='#17130e';c.fillRect(4,101,112,15);c.fillStyle='#c7a24a';c.font='bold 8px Trebuchet MS';c.textAlign='center';c.fillText(med?'FIELD MEDIC':gun?'GUNSMITH':'ARMORER',60,111);
  c.strokeStyle='#d0ad58';c.lineWidth=2.5;c.strokeRect(2,2,116,116);c.strokeStyle='#4d3a20';c.lineWidth=1;c.strokeRect(6,6,108,108);c.restore();
}
function wireGearDnD(){
  const items=document.querySelectorAll('.gear-item[draggable="true"]'),slots=document.querySelectorAll('.gear-slot[data-drop]');
  let touchDrag=null;
  const equip=(kind,id,target)=>{if(kind==='weapon'&&target==='weapon')eqW(id);if(kind==='vest'&&target==='vest')eqV(Number(id));if(kind==='helmet'&&target==='helmet')eqH(Number(id))};
  items.forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.kind+':'+el.dataset.id);e.dataTransfer.effectAllowed='move'});el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchDrag={kind:el.dataset.kind,id:el.dataset.id};});el.addEventListener('click',e=>{if(e.target.closest('button'))return;const k=el.dataset.kind,id=Number(el.dataset.id);if(k==='weapon')eqW(el.dataset.id);else if(k==='vest')eqV(id);else if(k==='helmet')eqH(id)});});
  document.addEventListener('pointerup',e=>{if(!touchDrag||e.pointerType!=='touch')return;const targetEl=document.elementFromPoint(e.clientX,e.clientY),slot=targetEl&&targetEl.closest('.gear-slot[data-drop]');if(slot)equip(touchDrag.kind,touchDrag.id,slot.dataset.drop);touchDrag=null},{once:true});
  slots.forEach(slot=>{slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drop-hot')});slot.addEventListener('dragleave',()=>slot.classList.remove('drop-hot'));slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('drop-hot');const raw=e.dataTransfer.getData('text/plain').split(':'),kind=raw[0],id=raw[1];equip(kind,id,slot.dataset.drop)});});
}

function nearHouse(){
  if(!G||G.inHouse)return null;let best=null,bd=Infinity;
  for(const o of G.obs){if(o.t!=='house'&&o.t!=='shop')continue;
    const dx=Math.abs(G.p.x-(o.x+o.w/2)),dy=G.p.y-(o.y+o.h+16);
    // The entrance is the middle of the south wall: no teleporting through side walls.
    const d=Math.hypot(dx,dy);if(dx<Math.min(34,o.w*.24)&&dy>-12&&dy<48&&d<bd){bd=d;best=o}}
  return best;
}

 else {items=G.floorItems.filter(q=>!q.done&&Math.hypot(q.x-G.p.x,q.y-G.p.y)<95).map(q=>({q,src:'floor'}));for(const c of G.crates){if(!c.done&&Math.hypot(c.x-G.p.x,c.y-G.p.y)<48)items.push({q:{...c,n:c.kind==='bag'?'Рюкзак':c.kind==='medbag'?'Медицинская сумка':c.kind==='cabinet'?'Шкафчик':c.kind==='tool'?'Ящик с инструментами':'Контейнер'},src:'crate'})}}

  if(o.style%5===0){furniture(o.x+12,o.y+12,o.w*.38,o.h*.27,'#66513b');furniture(o.x+o.w*.55,o.y+o.h*.55,o.w*.3,o.h*.2,'#4e554c')}

function steer(e,tx,ty,spd,dt){

  return m}
function enemyAI(e,dt,dm){

      if(e.rt<=0){const sd=Math.sin(performance.now()/800+e.id)>0?1:-1;
        if(d>e.rng*.8)m=steer(e,p.x,p.y,e.sp,dt);

    }else{e.lt-=dt;m=steer(e,e.lx,e.ly,e.sp*.9,dt);e.ang=Math.atan2(e.ly-e.y,e.lx-e.x);
      if(e.lt<=0||Math.hypot(e.lx-e.x,e.ly-e.y)<25){e.st='search';e.lt=3}}
